services:
  backend:
    build:
      context: ..
    restart: unless-stopped
    environment:
      TONGUE_SMART_DATABASE_URL: "${TONGUE_SMART_DATABASE_URL:-sqlite+pysqlite:////data/tongue_smart.db}"
    volumes:
      - backend_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../../frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend_data:
